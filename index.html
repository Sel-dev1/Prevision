<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PREVISION — Sachez avant de regarder</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
}

/* HERO */

.hero {
    min-height: 72vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    background:
        radial-gradient(circle at center, #3b0b0b 0%, #150303 35%, #080808 75%);
}

.logo {
    font-size: clamp(52px, 10vw, 100px);
    font-weight: 900;
    letter-spacing: 12px;
    margin-bottom: 12px;
}

.slogan {
    font-size: clamp(18px, 3vw, 28px);
    color: #d6d6d6;
    letter-spacing: 3px;
    margin-bottom: 45px;
}

/* SEARCH */

.search-box {
    width: min(720px, 90%);
    display: flex;
    background: #151515;
    border: 1px solid #4a4a4a;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.search-box input {
    flex: 1;
    padding: 18px 20px;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 17px;
}

.search-box input::placeholder {
    color: #888;
}

.search-box button {
    padding: 0 28px;
    border: none;
    background: #9e1111;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}

.search-box button:hover {
    background: #c51616;
}

/* PLATFORMS */

.platform-section {
    padding: 60px 30px;
    text-align: center;
}

.section-title {
    font-size: 30px;
    margin-bottom: 35px;
}

.platforms {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding: 10px 5px 25px;
    scrollbar-width: thin;
}

.platform {
    min-width: 190px;
    height: 120px;
    border-radius: 14px;
    background: linear-gradient(145deg, #1c1c1c, #101010);
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
    transition: transform 0.2s, border 0.2s;
}

.platform:hover {
    transform: translateY(-5px);
    border-color: #9e1111;
}

/* RESULTS */

.results-section {
    width: min(1200px, 92%);
    margin: auto;
    padding: 30px 0 80px;
}

.results-title {
    font-size: 28px;
    margin-bottom: 25px;
}

.results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 25px;
}

.movie-card {
    background: #141414;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #292929;
    transition: transform 0.2s, border 0.2s;
    cursor: pointer;
}

.movie-card:hover {
    transform: translateY(-6px);
    border-color: #9e1111;
}

.movie-card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
}

.movie-info {
    padding: 15px;
}

.movie-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

.movie-year {
    color: #aaa;
    font-size: 14px;
}

.movie-rating {
    margin-top: 8px;
    color: #e2b93b;
}

.loading,
.error,
.no-results {
    text-align: center;
    padding: 30px;
    color: #aaa;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 35px 20px;
    border-top: 1px solid #222;
    color: #777;
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 600px) {

    .logo {
        letter-spacing: 6px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        padding: 15px;
    }

    .platform {
        min-width: 160px;
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="logo">PREVISION</div>

    <div class="slogan">
        Sachez avant de regarder.
    </div>

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="Rechercher un film ou une série..."
        >

        <button onclick="searchMovies()">
            Rechercher
        </button>

    </div>

</section>


<section class="platform-section">

    <h2 class="section-title">
        Où regarder ?
    </h2>

    <div class="platforms">

        <div class="platform">Netflix</div>

        <div class="platform">Prime Video</div>

        <div class="platform">Disney+</div>

        <div class="platform">Apple TV+</div>

        <div class="platform">CANAL+</div>

        <div class="platform">Max</div>

    </div>

</section>


<section class="results-section">

    <h2 class="results-title">
        Résultats
    </h2>

    <div id="results" class="results">

        <div class="no-results">
            Recherchez un film pour commencer.
        </div>

    </div>

</section>


<footer>

    PREVISION — Sachez avant de regarder.

</footer>


<script>

const API_URL =
    "https://prevision-api.gendronselyann.workers.dev";


async function searchMovies() {

    const input =
        document.getElementById("searchInput");

    const results =
        document.getElementById("results");

    const query =
        input.value.trim();


    if (!query) {

        results.innerHTML =
            '<div class="error">Veuillez entrer un titre.</div>';

        return;
    }


    results.innerHTML =
        '<div class="loading">Recherche en cours...</div>';


    try {

        const response =
            await fetch(
                API_URL +
                "/search?query=" +
                encodeURIComponent(query)
            );


        if (!response.ok) {

            throw new Error("Erreur API");

        }


        const data =
            await response.json();


        const movies =
            data.results.filter(
                item =>
                    item.media_type === "movie" ||
                    item.media_type === "tv"
            );


        if (!movies.length) {

            results.innerHTML =
                '<div class="no-results">Aucun résultat trouvé.</div>';

            return;
        }


        results.innerHTML = "";


        movies.slice(0, 12).forEach(movie => {

            const card =
                document.createElement("div");

            card.className =
                "movie-card";


            const title =
                movie.title ||
                movie.name ||
                "Sans titre";


            const date =
                movie.release_date ||
                movie.first_air_date ||
                "";


            const year =
                date ? date.substring(0, 4) : "";


            const rating =
                movie.vote_average
                    ? movie.vote_average.toFixed(1)
                    : "N/A";


            const image =
                movie.poster_path
                    ? "https://image.tmdb.org/t/p/w500" +
                      movie.poster_path
                    : "";


            card.innerHTML = `

                ${
                    image
                    ? `<img src="${image}" alt="${title}">`
                    : `<div style="
                        aspect-ratio:2/3;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#222;
                        color:#777;
                      ">
                        Pas d'affiche
                      </div>`
                }

                <div class="movie-info">

                    <div class="movie-title">
                        ${title}
                    </div>

                    <div class="movie-year">
                        ${year}
                    </div>

                    <div class="movie-rating">
                        ⭐ ${rating}/10
                    </div>

                </div>
            `;


            results.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        results.innerHTML =
            '<div class="error">Impossible de contacter PREVISION.</div>';

    }

}


document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            searchMovies();

        }

    });

</script>

</body>
</html>
