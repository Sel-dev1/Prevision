<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PREVISION — Sachez avant de regarder</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
}

/* HERO */

.hero {
    min-height: 72vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    background:
        radial-gradient(circle at center, #3b0b0b 0%, #150303 35%, #080808 75%);
}

.logo {
    font-size: clamp(52px, 10vw, 100px);
    font-weight: 900;
    letter-spacing: 12px;
    margin-bottom: 12px;
}

.slogan {
    font-size: clamp(18px, 3vw, 28px);
    color: #d6d6d6;
    letter-spacing: 3px;
    margin-bottom: 45px;
}

/* SEARCH */

.search-box {
    width: min(720px, 90%);
    display: flex;
    background: #151515;
    border: 1px solid #4a4a4a;
    border-radius: 12px;
    overflow: hidden;
}

.search-box input {
    flex: 1;
    padding: 18px 20px;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 17px;
}

.search-box input::placeholder {
    color: #888;
}

.search-box button {
    padding: 0 28px;
    border: none;
    background: #9e1111;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}

.search-box button:hover {
    background: #c51616;
}

/* SECTIONS */

section {
    width: min(1200px, 92%);
    margin: auto;
}

.section-title {
    font-size: 30px;
    margin-bottom: 25px;
}

/* PLATFORMS */

.platform-section {
    padding: 60px 0;
}

.platforms {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding: 10px 5px 25px;
}

.platform {
    min-width: 190px;
    height: 120px;
    border-radius: 14px;
    background: linear-gradient(145deg, #1c1c1c, #101010);
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
    cursor: pointer;
    transition: 0.2s;
}

.platform:hover {
    transform: translateY(-5px);
    border-color: #b51616;
    box-shadow: 0 10px 30px rgba(120,0,0,0.25);
}

/* CATALOG */

.catalog-section {
    padding: 20px 0 70px;
}

.catalog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.catalog-name {
    font-size: 30px;
}

.catalog-type {
    display: flex;
    gap: 10px;
}

.catalog-type button {
    background: #171717;
    color: white;
    border: 1px solid #333;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.catalog-type button.active,
.catalog-type button:hover {
    background: #9e1111;
    border-color: #9e1111;
}

/* RESULTS */

.results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 25px;
}

.movie-card {
    background: #141414;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #292929;
    transition: 0.2s;
}

.movie-card:hover {
    transform: translateY(-6px);
    border-color: #9e1111;
}

.movie-card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
}

.movie-info {
    padding: 15px;
}

.movie-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

.movie-year {
    color: #aaa;
    font-size: 14px;
}

.movie-rating {
    margin-top: 8px;
    color: #e2b93b;
}

.message {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: #888;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 35px 20px;
    border-top: 1px solid #222;
    color: #777;
}

/* MOBILE */

@media (max-width: 600px) {

    .logo {
        letter-spacing: 6px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        padding: 15px;
    }

    .catalog-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .platform {
        min-width: 160px;
    }
}
</style>
</head>

<body>

<!-- HERO -->

<div class="hero">

    <div class="logo">PREVISION</div>

    <div class="slogan">
        Sachez avant de regarder.
    </div>

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="Rechercher un film ou une série..."
        >

        <button onclick="searchMovies()">
            Rechercher
        </button>

    </div>

</div>


<!-- PLATFORMS -->

<section class="platform-section">

    <h2 class="section-title">
        Explorer par plateforme
    </h2>

    <div class="platforms">

        <div class="platform" onclick="loadCatalog(8, 'Netflix')">
            Netflix
        </div>

        <div class="platform" onclick="loadCatalog(119, 'Prime Video')">
            Prime Video
        </div>

        <div class="platform" onclick="loadCatalog(337, 'Disney+')">
            Disney+
        </div>

        <div class="platform" onclick="loadCatalog(350, 'Apple TV+')">
            Apple TV+
        </div>

        <div class="platform" onclick="loadCatalog(381, 'CANAL+')">
            CANAL+
        </div>

        <div class="platform" onclick="loadCatalog(1899, 'Max')">
            Max
        </div>

    </div>

</section>


<!-- CATALOG -->

<section class="catalog-section">

    <div class="catalog-header">

        <h2 id="catalogName" class="catalog-name">
            Catalogue
        </h2>

        <div class="catalog-type">

            <button
                id="moviesButton"
                class="active"
                onclick="changeType('movie')"
            >
                Films
            </button>

            <button
                id="seriesButton"
                onclick="changeType('tv')"
            >
                Séries
            </button>

        </div>

    </div>

    <div id="results" class="results">

        <div class="message">
            Choisissez une plateforme pour découvrir son catalogue.
        </div>

    </div>

</section>


<footer>

    PREVISION — Sachez avant de regarder.

</footer>


<script>

const API_URL =
    "https://prevision-api.gendronselyann.workers.dev";

let currentPlatform = null;
let currentPlatformName = "";
let currentType = "movie";


/* RECHERCHE */

async function searchMovies() {

    const query =
        document.getElementById("searchInput").value.trim();

    const results =
        document.getElementById("results");

    if (!query) {

        results.innerHTML =
            '<div class="message">Veuillez entrer un titre.</div>';

        return;
    }

    results.innerHTML =
        '<div class="message">Recherche en cours...</div>';

    try {

        const response =
            await fetch(
                API_URL +
                "/search?query=" +
                encodeURIComponent(query)
            );

        const data =
            await response.json();

        const items =
            (data.results || []).filter(
                item =>
                    item.media_type === "movie" ||
                    item.media_type === "tv"
            );

        displayResults(items);

    } catch (error) {

        results.innerHTML =
            '<div class="message">Impossible de contacter PREVISION.</div>';

    }
}


/* CATALOGUE */

async function loadCatalog(platform, name) {

    currentPlatform = platform;
    currentPlatformName = name;
    currentType = "movie";

    document.getElementById("moviesButton")
        .classList.add("active");

    document.getElementById("seriesButton")
        .classList.remove("active");

    document.getElementById("catalogName")
        .textContent =
        name + " — Films";

    await fetchCatalog();

}


/* CHANGER FILMS / SERIES */

async function changeType(type) {

    if (!currentPlatform) {

        return;

    }

    currentType = type;

    document.getElementById("moviesButton")
        .classList.toggle("active", type === "movie");

    document.getElementById("seriesButton")
        .classList.toggle("active", type === "tv");

    document.getElementById("catalogName")
        .textContent =
        currentPlatformName +
        (type === "movie" ? " — Films" : " — Séries");

    await fetchCatalog();

}


/* RECUPERATION DU CATALOGUE */

async function fetchCatalog() {

    const results =
        document.getElementById("results");

    results.innerHTML =
        '<div class="message">Chargement du catalogue...</div>';

    try {

        let endpoint;

        if (currentType === "movie") {

            endpoint =
                API_URL +
                "/catalog?platform=" +
                currentPlatform;

        } else {

            endpoint =
                API_URL +
                "/series?platform=" +
                currentPlatform;

        }

        const response =
            await fetch(endpoint);

        const data =
            await response.json();

        displayResults(data.results || []);

    } catch (error) {

        results.innerHTML =
            '<div class="message">Impossible de charger le catalogue.</div>';

    }
}


/* AFFICHAGE */

function displayResults(items) {

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if (!items.length) {

        results.innerHTML =
            '<div class="message">Aucun résultat trouvé.</div>';

        return;
    }

    items.slice(0, 24).forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "movie-card";

        const title =
            item.title ||
            item.name ||
            "Sans titre";

        const date =
            item.release_date ||
            item.first_air_date ||
            "";

        const year =
            date ? date.substring(0, 4) : "";

        const rating =
            item.vote_average
                ? item.vote_average.toFixed(1)
                : "N/A";

        const image =
            item.poster_path
                ? "https://image.tmdb.org/t/p/w500" +
                  item.poster_path
                : null;

        card.innerHTML = `

            ${
                image
                ? `
                    <img
                        src="${image}"
                        alt="${title}"
                    >
                  `
                : `
                    <div style="
                        aspect-ratio:2/3;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#222;
                        color:#777;
                    ">
                        Pas d'affiche
                    </div>
                  `
            }

            <div class="movie-info">

                <div class="movie-title">
                    ${title}
                </div>

                <div class="movie-year">
                    ${year}
                </div>

                <div class="movie-rating">
                    ⭐ ${rating}/10
                </div>

            </div>
        `;

        results.appendChild(card);

    });
}


/* ENTREE */

document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            searchMovies();

        }

    });

</script>

</body>
</html>
